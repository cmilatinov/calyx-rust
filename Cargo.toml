[workspace]
members = [
    "crates/calyx_shader",
    "crates/calyx_engine",
    "crates/calyx_editor",
    "crates/calyx_project",
    "crates/calyx_icon_atlas",
    "crates/calyx_remote_protocol",
    "crates/calyx_ctl",
    "sandbox",
]
resolver = "2"

# Build scripts and proc macros keep full debug info, like everything else.
# Cargo otherwise builds a crate used both at build time and at run time once
# when a build needs it at run time and once more with less debug info when it
# does not, so the project assembly's build and the editor's would compile
# calyx_engine's proc macros differently and link different engine builds
# (see crates/calyx_engine_feature_pins).
[profile.dev.build-override]
debug = true

[profile.release-with-debug]
inherits = "release"
incremental = true
debug = true

[workspace.dependencies]
approx = "0.5"
bytemuck = "1.14.0"
bimap = "0.6.3"
chrono = "0.4.31"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
dunce = "1.0.4"
eframe = { version = "0.31.1", features = ["wgpu", "persistence"] }
egui = { version = "0.31.1", features = ["mint", "persistence"] }
egui_extras = { version = "0.31.1", features = ["all_loaders"] }
egui_tiles = "0.12.0"
egui-wgpu = "0.31.1"
enum_dispatch = "0.3.13"
enumflags2 = "0.7.12"
thiserror = "2"
transform-gizmo-egui = "0.5.0"
lazy_static = "1.4.0"
log = "0.4.20"
serde = { version = "1.0.189", features = ["derive"] }
uuid = { version = "1.5.0", features = ["v4", "serde"] }
nalgebra-glm = { version = "0.19.0", features = ["serde-serialize", "convert-mint"] }
rapier3d = { version = "0.25.1", features = ["serde-serialize", "debug-render"] }
ufbx = "0.11"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
urlencoding = "2.1.3"
notify = "8.0.0"
inventory = "0.3.12"
sha-1 = "0.10.1"
legion = "0.4.0"
nalgebra = { version = "0.33.0", features = ["mint", "convert-mint"] }
serde_json = "1.0.107"
glob = "0.3.1"
relative-path = "2.0.1"
path-absolutize = "3.1.1"
rusty_pool = "0.7.0"
image = "0.25.1"
indexmap = "2"
naga = { version = "25.0.1", features = ["wgsl-in"] }
toml = "0.9.4"
tinytemplate = "1.2.1"
downcast-rs = "2.0.1"
mint = "0.5.9"
regex = "1.10.3"
petgraph = { version = "0.8.1", features = ["serde-1"] }
winit = "0.30.7"
num = "0.4.1"
num-derive = "0.4.1"
num-traits = "0.2.17"
libloading = "0.8.9"
convert_case = "0.8.0"
re_ui = "0.23.1"
rfd = "0.15.1"
open = "5.3.2"
proc-macro2 = "1.0.69"
syn = { version = "2.0.38", features = ["full", "extra-traits", "parsing"] }
quote = "1.0.33"
darling = "0.20.11"
paste = "1.0.15"
renet = "1.0.0"
renet_netcode = "1.0.0"
bincode = { version = "2.0.1", features = ["serde"] }
lerp = { version = "0.5.0", features = ["derive"] }
typed-builder = "0.21.0"
rand = "0.9.2"
env_filter = "1.0.0"
pollster = "0.4"
resvg = { version = "0.37.0", default-features = false }
