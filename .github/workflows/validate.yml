name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AGENTIC_VERSION: v0.9.0
  CARGO_TERM_COLOR: always

jobs:
  validate:
    # Render tests need a graphics adapter; Windows runners provide one through WARP.
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      # rustup reads the dated nightly and its components from rust-toolchain.toml, so CI builds with the
      # same toolchain as every developer machine.
      - name: Install the toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install
          rustc -vV
          cargo -V

      - uses: Swatinem/rust-cache@v2
        with:
          # rust-cache already keys on Cargo.lock and the rustc version, so a new pin starts a new cache.
          shared-key: validate

      # Windows runners have no GPU, and wgpu here is built with only the Vulkan and GLES backends (no DX12, so
      # no WARP). Mesa's software drivers provide both: lavapipe for Vulkan and llvmpipe behind opengl32.dll for
      # GLES. opengl32.dll is not a known DLL, so a copy next to the test binaries wins over the system one.
      - name: Install Mesa software rendering
        shell: bash
        run: |
          set -e
          curl.exe -L --retry 5 "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z" -o "$RUNNER_TEMP/mesa.7z"
          7z.exe e "$RUNNER_TEMP/mesa.7z" -o"$RUNNER_TEMP/mesa" 'x64/opengl32.dll' 'x64/libgallium_wgl.dll' 'x64/libglapi.dll' 'x64/vulkan_lvp.dll' 'x64/lvp_icd.x86_64.json'
          for dir in target/debug target/debug/deps; do
            mkdir -p "$dir"
            cp -v "$RUNNER_TEMP"/mesa/*.dll "$dir"/
          done
          # The runner account is elevated, and the Vulkan loader ignores VK_DRIVER_FILES in elevated processes,
          # so register lavapipe the way an installed driver would be.
          icd="$(cygpath --windows "$RUNNER_TEMP/mesa/lvp_icd.x86_64.json")"
          MSYS_NO_PATHCONV=1 reg.exe add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$icd" /t REG_DWORD /d 0 /f
          echo "VK_LOADER_DEBUG=error" >> "$GITHUB_ENV"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
        env:
          MESA_VERSION: 24.2.3

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      # The agentic CLI lives in a private repository, so installing it needs a token with read access to
      # corebit-instruments/agentic in the AGENTIC_TOKEN secret. Pull requests from forks never receive secrets.
      - name: Install the agentic CLI
        id: agentic
        shell: bash
        env:
          AGENTIC_TOKEN: ${{ secrets.AGENTIC_TOKEN }}
        run: |
          if [ -z "$AGENTIC_TOKEN" ]; then
            echo "::warning title=agentic CLI not installed::AGENTIC_TOKEN is not set; running the checks declared in agentic.toml directly instead of through agentic local validate."
            echo "installed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --global url."https://x-access-token:${AGENTIC_TOKEN}@github.com/corebit-instruments/".insteadOf "https://github.com/corebit-instruments/"
          uv tool install "agentic-tools @ git+https://github.com/corebit-instruments/agentic@${AGENTIC_VERSION}#subdirectory=tools"
          git config --global --unset-all url."https://x-access-token:${AGENTIC_TOKEN}@github.com/corebit-instruments/".insteadOf
          agentic --version
          echo "installed=true" >> "$GITHUB_OUTPUT"

      - name: agentic local validate
        if: steps.agentic.outputs.installed == 'true'
        shell: bash
        run: agentic local validate

      # Fallback without the agentic CLI: run every [[check]] that agentic.toml marks for validate, in order,
      # so the checks stay the single source of truth.
      - name: Run the validate checks from agentic.toml
        if: steps.agentic.outputs.installed != 'true'
        shell: bash
        run: |
          uv run --no-project --python 3.13 python - <<'EOF'
          import subprocess, sys, tomllib

          with open("agentic.toml", "rb") as f:
              checks = [c for c in tomllib.load(f).get("check", []) if "validate" in c.get("on", [])]
          if not checks:
              sys.exit("no checks marked validate in agentic.toml")
          for check in checks:
              print(f"::group::{check['name']}: {' '.join(check['run'])}", flush=True)
              code = subprocess.run(check["run"]).returncode
              print("::endgroup::", flush=True)
              if code != 0:
                  sys.exit(f"check {check['name']} failed with exit code {code}")
          EOF
