# A clump of tall clay grass for stealth brush: six crossed fan cards of
# five tapered blades each, about 2.2 m tall, so a patch packed with
# clumps stands over a tank's turret as one dense mass. The cards stand
# almost upright on the clump's origin; the grass shader sways and bends
# them by their height above it.
# Unbevelled and flat shaded: about 80 triangles a card, so a dense patch
# stays cheap.
# Regenerate with calyx_model_gen; dimensions in metres.
shading = "flat"

